payload:
  # 局域网与内网解析
  - '*.lan'
  - '*.local'
  - '*.arpa'
  # 时间同步（NTP 客户端常按域名轮询）
  - 'time.*.com'
  - 'ntp.*.com'
  # GitHub 全系：主站、原始文件、静态资源、OAuth
  - '+.github.com'
  - '+.githubusercontent.com'
  - '+.githubassets.com'
  - '+.githubapp.com'
  # Tailscale 组网，解析失败会导致节点离线
  - '+.tailscale.com'
  - '+.ts.net'
  - '+.tailscale.io'
  # Cloudflare Tunnel 与 Access：与 prepend-rules 里的 DIRECT 规则配套
  - '+.trycloudflare.com'
  - '+.argotunnel.com'
  - '+.cloudflare.com'
  - '+.cloudflareaccess.com'
  # Windows 联网状态检测，被伪造会显示"无 Internet"
  - '*.msftncsi.com'
  - 'www.msftconnecttest.com'
